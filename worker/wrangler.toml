name = "splove-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "splove"
database_id = "e8b0a65c-fc56-4d53-a236-ac7bea4f775f"

[vars]
ALLOWED_ORIGIN = "https://sorvalliny.github.io"
GAME_URL = "https://sorvalliny.github.io/splove-game/"
BOT_NAME = "splove_game_bot"
INVITE_CODE = "splav"
ADMIN_IDS = "956875"
CHAT_SIZE = "70"
WEEKLY_POST = "off"

# Ночь на понедельник по Москве (воскресенье 21:05 UTC): бонусы недели и итог в чат.
[triggers]
crons = ["5 21 * * SUN"]
